<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Один день на МКС</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bg-music" src="audio/music.mp3" loop></audio>

    <div class="background" id="bg"></div>
    <div class="stars" id="star-layer"></div>
    <div class="overlay"></div>

    <!-- Часы теперь отдельно, НЕ внутри game-container -->
    <div class="time">
        <span id="hours">00</span><span id="colon">:</span><span id="minutes">00</span> UTC
    </div>
    
    <img id="floating-object-1" class="floater" src="images/alarm.png" alt="item1" style="display: none; opacity: 0;">
    <img id="floating-object-2" class="floater" src="" alt="item2" style="display: none; opacity: 0;">
    <img id="floating-object-3" class="floater" src="" alt="item3" style="display: none; opacity: 0;">
    
    <div class="content">
    <div id="game-container">
        
        <!-- Заголовок в две строки -->
        <h1 id="start-title">ОДИН ДЕНЬ<br>НА МКС</h1>

        <!-- Стартовая кнопка остаётся в центре -->
        <div id="start-choices">
            <button id="start-button">НАЧАТЬ ПЕРВЫЙ ДЕНЬ</button>
        </div>

    </div>
</div>
<div id="scene-panel" class="hidden">
    <div class="scene-panel-content">
        <div id="game-text"></div>
        <div id="choices"></div>
    </div>
</div>


    <script src="script.js"></script>
</body>
</html>
